[project]
name = "agent-python-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "along", email = "37095223+YangWenLong123@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
agent-python-lab = "agent_python_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
